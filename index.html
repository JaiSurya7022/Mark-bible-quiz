<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Bible Quiz - Multi-Language</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-2xl glass-card rounded-3xl shadow-2xl overflow-hidden">
        <!-- Progress bar for Quiz -->
        <div id="quiz-progress-container" class="hidden h-2 bg-slate-200 w-full">
            <div id="progress-bar" class="h-full bg-indigo-600 transition-all duration-300" style="width: 0%"></div>
        </div>

        <div class="p-6 md:p-10">
            <!-- 1. Language Selection Screen -->
            <div id="lang-screen" class="text-center py-6">
                <h2 class="text-4xl font-black text-slate-800 mb-2">Mark Bible Quiz</h2>
                <p class="text-slate-500 mb-8 font-medium">Select your language / மொழியைத் தேர்ந்தெடுக்கவும் / ಭಾಷೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ</p>
                <div class="space-y-4 max-w-xs mx-auto">
                    <button onclick="appState.setLanguage('en')" class="w-full py-4 bg-white border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 rounded-2xl font-bold text-lg transition-all shadow-sm">English</button>
                    <button onclick="appState.setLanguage('ta')" class="w-full py-4 bg-white border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 rounded-2xl font-bold text-lg transition-all shadow-sm">தமிழ் (Tamil)</button>
                    <button onclick="appState.setLanguage('kn')" class="w-full py-4 bg-white border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 rounded-2xl font-bold text-lg transition-all shadow-sm">ಕನ್ನಡ (Kannada)</button>
                </div>
            </div>

            <!-- 2. Chapter Selection Screen -->
            <div id="chapter-screen" class="hidden text-center">
                <div class="flex items-center justify-between mb-6">
                    <button onclick="appState.showScreen('lang-screen')" class="flex items-center text-indigo-600 font-bold hover:text-indigo-800 transition-colors">
                        <span id="ui-back-lang">← Back</span>
                    </button>
                    <h2 class="text-2xl font-bold text-slate-800" id="chapter-title">Select Chapter</h2>
                    <div class="w-10"></div>
                </div>
                <p class="text-slate-500 mb-6 font-medium" id="chapter-subtitle">Gospel of Mark (1-16)</p>
                <div class="chapter-grid" id="chapter-buttons">
                    <!-- Chapters 1-16 generated by JS -->
                </div>
            </div>

            <!-- 3. Quiz Question Screen -->
            <div id="quiz-screen" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="appState.showScreen('chapter-screen')" class="text-slate-500 hover:text-indigo-600 transition-colors flex items-center font-bold text-sm">
                        <span id="ui-back-chapter">← Back</span>
                    </button>
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold text-indigo-600 px-3 py-1 bg-indigo-50 rounded-full uppercase tracking-wider" id="info-tag">Ch. 1</span>
                        <span class="text-slate-400 text-xs font-bold" id="question-index">1 / 10</span>
                    </div>
                </div>
                
                <h3 id="question-text" class="text-xl md:text-2xl font-bold text-slate-800 mb-8 leading-relaxed"></h3>

                <div id="options-container" class="space-y-3">
                    <!-- Options buttons -->
                </div>

                <div id="feedback-area" class="hidden mt-8 p-5 rounded-2xl border-l-8 transition-all">
                    <p id="feedback-msg" class="font-bold text-lg mb-1"></p>
                    <p id="explanation-text" class="text-slate-600 text-sm leading-relaxed"></p>
                    <button id="next-button-text" onclick="appState.nextQuestion()" class="mt-5 w-full bg-slate-800 text-white py-4 rounded-xl font-bold hover:bg-slate-900 transition-all shadow-lg active:scale-95">Next Question</button>
                </div>
            </div>

            <!-- 4. Result Screen -->
            <div id="result-screen" class="hidden text-center py-10">
                <div class="text-6xl mb-6">🏆</div>
                <h2 class="text-3xl font-bold text-slate-800 mb-2" id="result-title">Chapter Complete!</h2>
                <p class="text-4xl font-black text-indigo-600 mb-6" id="final-score">0 / 0</p>
                <div class="flex flex-col gap-3 max-w-xs mx-auto">
                    <button id="btn-retry" onclick="appState.restartChapter()" class="py-4 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition-all">Retry Chapter</button>
                    <button id="btn-other" onclick="appState.showScreen('chapter-screen')" class="py-4 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition-all">Another Chapter</button>
                </div>
            </div>
        </div>
    </div>
    <script src="markquiz.js"></script>
</body>
</html>
